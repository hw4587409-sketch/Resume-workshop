<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简历工坊</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;color:#222;font-family:"Microsoft YaHei",Arial,sans-serif}
header{background:white;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
button{padding:9px 14px;border:1px solid #ccd3db;background:white;border-radius:6px;cursor:pointer}
.primary{background:#315d83;color:white}
.layout{display:grid;grid-template-columns:400px 1fr;gap:20px;max-width:1400px;margin:20px auto;padding:0 15px}
.editor{background:white;border-radius:10px;padding:18px;height:calc(100vh - 100px);overflow:auto;position:sticky;top:90px;align-self:start}
.group{border-top:1px solid #eee;padding:15px 0}
h3{font-size:15px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field{display:flex;flex-direction:column;gap:5px}
.full{grid-column:1/-1}
label{font-size:12px;color:#666}
input,textarea{width:100%;padding:9px;border:1px solid #ddd;border-radius:5px;font:13px Arial,"Microsoft YaHei"}
textarea{min-height:75px;resize:vertical}
.rich-field{display:flex;flex-direction:column;gap:6px}
.rich-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rich-toolbar button{padding:5px 10px;font-size:12px;border:1px solid #d5dbe2;border-radius:5px;background:#f8fafc;color:#334155}
.rich-toolbar button:hover{background:#eaf0f6}
.rich-editor{width:100%;min-height:90px;padding:9px;border:1px solid #ddd;border-radius:5px;font:13px/1.6 Arial,"Microsoft YaHei",sans-serif;white-space:normal;overflow-wrap:anywhere;outline:none}
.rich-editor:focus{border-color:#7898b5;box-shadow:0 0 0 2px rgba(49,93,131,.08)}
.rich-editor:empty:before{content:attr(data-placeholder);color:#a0a7af;pointer-events:none}
.rich-editor ul,.rich-editor ol{margin:4px 0;padding-left:22px}
.item-detail ul,.item-detail ol{margin:3px 0;padding-left:20px}
.item-detail li{margin:1px 0}
.item-detail ol li::marker,.rich-editor ol li::marker{font-weight:700}
.entry{border:1px solid #e5e5e5;padding:10px;margin:10px 0;border-radius:7px}
.entry-title{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px}
.add{width:100%;border-style:dashed;color:#315d83}
.preview{--fit-font:12px;--fit-line:1.6;--fit-space:1;background:white;width:100%;max-width:820px;min-height:1100px;margin:auto;padding:48px 55px;box-shadow:0 3px 15px #ddd;font-size:var(--fit-font);line-height:var(--fit-line)}
.resume-header{display:grid;grid-template-columns:minmax(0,1fr) var(--photo-width,70px);column-gap:14px;align-items:center;min-height:78px;margin-bottom:calc(5px * var(--fit-space,1))}
.personal-info{min-width:0;display:flex;flex-direction:column;gap:calc(7px * var(--fit-space,1));font-size:11px;line-height:1.7;text-align:center}
.resume-name{font-size:calc(var(--fit-font) * 2.15);line-height:1.35;margin:0;text-align:center}
.contact{display:flex;flex-direction:column;gap:5px;min-width:0}
.info-row{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;column-gap:16px;row-gap:2px;min-width:0}
.info-row span{overflow-wrap:anywhere}
.photo{grid-column:2;grid-row:1;width:var(--photo-width,70px);height:var(--photo-height,92px);object-fit:cover;object-position:center;border:1px solid #ddd;display:none;align-self:center}
.section{margin-top:calc(7px * var(--fit-space,1))}
.resume-header + div .section{margin-top:2px}
.section h2{font-size:calc(var(--fit-font) * 1.2);border-bottom:1.5px solid #444;padding-bottom:4px;margin-bottom:7px}
.resume-item{margin-bottom:calc(8px * var(--fit-space,1));break-inside:avoid}
.item-head{display:flex;justify-content:space-between;font-weight:bold;gap:10px}.experience-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);align-items:baseline;gap:10px}.experience-org{justify-self:start;min-width:0}.experience-role{justify-self:center;text-align:center;min-width:0}.experience-date{justify-self:end;text-align:right;min-width:0}
.item-sub{font-size:calc(var(--fit-font) * .92);line-height:var(--fit-line)}
.item-detail{white-space:pre-wrap;font-size:calc(var(--fit-font) * .92);line-height:var(--fit-line);margin-top:2px}
.example{color:#a0a7af!important}.example-tag{display:inline-block;font-size:9px;color:#9aa3ad;border:1px solid #d8dde3;border-radius:3px;padding:0 4px;margin-left:5px;font-weight:normal}.photo-placeholder{grid-column:2;grid-row:1;width:var(--photo-width,70px);height:var(--photo-height,92px);border:1px dashed #b8c1ca;background:#f7f8fa;color:#9aa3ad;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:8px}

/* 模板一保持原有标题样式；新增图标仅在黑色/深蓝模板中显示 */
.preview:not(.theme-black):not(.theme-navy) .section h2 .heading-icon{display:none}
.preview:not(.theme-black):not(.theme-navy) .section h2 .heading-label{display:inline;color:inherit;background:none;padding:0;clip-path:none}
/* 新增模板：沿用白底和原内容，仅改变栏目标题及横线视觉 */
.preview.theme-black,.preview.theme-navy{background:#fff;color:#222}
.preview.theme-black{--resume-accent:#292929;--resume-accent-dark:#171717;--resume-accent-soft:#777}
.preview.theme-navy{--resume-accent:#123b73;--resume-accent-dark:#082957;--resume-accent-soft:#416b9f}
.preview.theme-black .section h2,.preview.theme-navy .section h2{display:flex;align-items:center;gap:0;border:0;padding:0;margin-bottom:7px;min-height:29px;font-size:calc(var(--fit-font) * 1.2);font-weight:700}
.preview.theme-black .section h2 .heading-label,.preview.theme-navy .section h2 .heading-label{display:inline-flex;align-items:center;gap:8px;position:relative;z-index:1;min-height:29px;padding:4px 23px 4px 10px;color:#fff;background:linear-gradient(105deg,var(--resume-accent-dark),var(--resume-accent));clip-path:polygon(0 0,88% 0,100% 100%,0 100%);white-space:nowrap}
.preview.theme-black .section h2 .heading-icon,.preview.theme-navy .section h2 .heading-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;font-size:15px;color:#fff}
.preview.theme-black .section h2:after,.preview.theme-navy .section h2:after{content:"";height:1px;background:var(--resume-accent);flex:1;align-self:flex-end;margin:0 0 1px -1px}
.preview.theme-black .section h2 .example-tag,.preview.theme-navy .section h2 .example-tag{color:#fff;border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.12)}
.preview.theme-black .item-head strong,.preview.theme-navy .item-head strong{color:var(--resume-accent-dark)}
.preview.theme-black .item-detail ul,.preview.theme-black .item-detail ol,.preview.theme-navy .item-detail ul,.preview.theme-navy .item-detail ol{padding-left:20px}
.preview.theme-black .item-detail li::marker{color:#333}
.preview.theme-navy .item-detail li::marker{color:#123b73}
.preview.theme-black .resume-name,.preview.theme-navy .resume-name{color:var(--resume-accent-dark)}
@media print{
 .preview.theme-black .section h2,.preview.theme-navy .section h2{display:flex;border:0;padding:0}
 .preview.theme-black .section h2 .heading-label,.preview.theme-navy .section h2 .heading-label{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .preview.theme-black .section h2:after,.preview.theme-navy .section h2:after{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}

@media(max-width:850px){
 .layout{grid-template-columns:1fr}
 .editor{height:auto;position:static;max-height:none}
 .preview{padding:30px 22px;min-height:900px}
}
@media print{
 body{background:white}
 header,.editor,.preview-label{display:none!important}
 .layout{display:block;margin:0;padding:0}
 .preview{box-sizing:border-box;display:block;width:210mm;height:297mm;min-height:297mm;padding:14mm 17mm;box-shadow:none;font-size:var(--fit-font);line-height:var(--fit-line);overflow:visible}
 .preview[data-one-page-fit="true"] > *{flex:0 0 auto}
 /* 一页模式：把各个简历模块作为纵向弹性项目，均匀分配页面剩余高度。
    不再只把内容堆在顶部；真实溢出时切回普通文档流，允许浏览器分页。 */
 .preview[data-fit-overflow="true"]{display:block!important;justify-content:initial!important;height:auto!important;min-height:0!important;overflow:visible!important;break-after:auto}
 .resume-header{grid-template-columns:minmax(0,1fr) var(--photo-width,20mm);column-gap:4mm;min-height:calc(var(--fit-font) * 6.5);margin-bottom:calc(var(--fit-font) * .3 * var(--fit-space,1));align-items:center}
 .photo,.photo-placeholder{width:var(--photo-width,20mm);height:var(--photo-height,26.4mm);align-self:center}
 .personal-info{font-size:calc(var(--fit-font) * .92);line-height:var(--fit-line);gap:calc(var(--fit-font) * .35 * var(--fit-space,1))}
 .resume-name{font-size:calc(var(--fit-font) * 2.15);line-height:1.35}
 .section{margin-top:calc(var(--fit-font) * .35 * var(--fit-space,1))}
 .resume-header + div .section{margin-top:calc(var(--fit-font) * .18 * var(--fit-space,1))}
 .section h2{font-size:calc(var(--fit-font) * 1.2);padding-bottom:calc(var(--fit-font) * .22 * var(--fit-space,1));margin-bottom:calc(var(--fit-font) * .35 * var(--fit-space,1))}
 .resume-item{margin-bottom:calc(var(--fit-font) * .42 * var(--fit-space,1));break-inside:avoid}
 .item-sub,.item-detail{font-size:calc(var(--fit-font) * .92);line-height:var(--fit-line)}
 .info-row{column-gap:4mm}
 .example,.example-tag,.photo-placeholder{display:none!important}
 @page{size:A4;margin:0}
}
</style>
</head>
<body>
<header>
<strong>简历工坊</strong>
<div>
<label for="templateSelect" style="font-size:12px;color:#555;margin-right:5px">模板样式</label><select id="templateSelect" aria-label="选择简历模板" style="padding:8px 10px;border:1px solid #ccd3db;border-radius:6px;margin-right:8px"><option value="original">模板一｜原有简约版</option><option value="black">模板二｜黑色经典版</option><option value="navy">模板三｜深蓝商务版</option></select><span id="fit-status" style="font-size:11px;color:#6b7280;margin-right:8px"></span>
<button onclick="resetAll()">恢复示例</button>
<button class="primary" onclick="fitOnePage()">智能排列为一页</button>
<button onclick="fitOnePage();window.print()">导出 PDF</button>
</div>
</header>
<div class="layout">
<section class="editor">
<h2>简历内容编辑</h2>
<div class="group">
<h3>个人信息</h3>
<div class="fields">
<div class="field"><label>姓名</label><input data-key="name" placeholder="请输入姓名"></div>
<div class="field"><label>电话</label><input data-key="phone" placeholder="请输入联系电话"></div>
<div class="field"><label>邮箱</label><input data-key="email" placeholder="请输入电子邮箱"></div>
<div class="field"><label>政治面貌</label><input data-key="political" placeholder="例如：中共党员 / 共青团员"></div>
<div class="field"><label>出生年月</label><input data-key="birthday" placeholder="例如：1998年5月"></div>
<div class="field"><label>籍贯</label><input data-key="hometown" placeholder="例如：江苏南京"></div>
<div class="field"><label>求职意向</label><input data-key="target" placeholder="例如：产品经理"></div>
<div class="field full"><label>个人补充信息</label><input data-key="profile" placeholder="例如：政治面貌、语言能力等"></div>
<div class="field full"><label>上传个人照片</label><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp"></div>
</div>
</div>
<div id="editors"></div>
<div class="group">
<h3>素质能力</h3>
<div class="field full rich-field"><label>专业技能</label><div class="rich-toolbar"><button type="button" data-rich-command="bold">B 加粗</button><button type="button" data-rich-command="insertOrderedList">1. 编号分点</button><button type="button" data-rich-command="insertUnorderedList">• 圆点分点</button></div><div class="rich-editor" contenteditable="true" data-rich-key="skills" data-key="skills" data-placeholder="填写专业技能"></div></div>
<div class="field full rich-field"><label>自我评价</label><div class="rich-toolbar"><button type="button" data-rich-command="bold">B 加粗</button><button type="button" data-rich-command="insertOrderedList">1. 编号分点</button><button type="button" data-rich-command="insertUnorderedList">• 圆点分点</button></div><div class="rich-editor" contenteditable="true" data-rich-key="summary" data-key="summary" data-placeholder="填写自我评价"></div></div>
</div>
</section>
<section>
<div class="preview-label">简历实时预览 <span style="font-size:12px;color:#8a929b">｜浅灰色为填写示例，填写后自动替换</span></div>
<article class="preview">
<div class="resume-header">
<div class="personal-info">
<h1 class="resume-name" id="v-name">你的姓名</h1>
<div class="contact" id="v-contact">
<div class="info-row"><span id="v-phone-field"></span><span id="v-email-field"></span><span id="v-political-field"></span></div>
<div class="info-row"><span id="v-birthday-field"></span><span id="v-hometown-field"></span><span id="v-target-field"></span><span id="v-profile-field"></span></div>
</div>
</div>
<img class="photo" id="v-photo" alt="个人照片"><div class="photo-placeholder" id="v-photo-placeholder">个人照片<br>示例位置</div>
</div>
<div id="v-education"></div><div id="v-work"></div><div id="v-intern"></div><div id="v-project"></div>
<div class="section"><h2><span class="heading-label"><span class="heading-icon">⚙</span><span>素质能力</span></span></h2><div class="item-detail" id="v-skills"></div><div class="item-detail" id="v-summary"></div></div>
</article>
</section>
</div>
<script>
const types={education:"教育经历",work:"工作经历",intern:"实习经历",project:"项目经历"};
const data={name:"",target:"",phone:"",email:"",political:"",birthday:"",hometown:"",profile:"",photo:"",skills:"",summary:"",education:[],work:[],intern:[],project:[]};
const dismissedExamples=new Set();
// 用户主动删除某个经历板块的最后一条记录后，记住该板块应隐藏。
const hiddenSections=new Set();
const personalExamples={
 name:"你的姓名",target:"求职意向：产品经理",phone:"电话：138-0000-0000",email:"邮箱：example@email.com",political:"政治面貌：中共党员",
 birthday:"出生年月：1998年5月",hometown:"籍贯：江苏南京",profile:"个人补充信息：语言能力、证书等"
};
function safe(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function cleanRich(html){
 const doc=new DOMParser().parseFromString(String(html||""),"text/html");
 const allowed=new Set(["B","STRONG","BR","UL","OL","LI","P","DIV"]);
 function clean(node){
  [...node.childNodes].forEach(child=>{
   if(child.nodeType===Node.ELEMENT_NODE){
    clean(child);
    if(!allowed.has(child.tagName)){child.replaceWith(...child.childNodes);}
    else [...child.attributes].forEach(a=>child.removeAttribute(a.name));
   }else if(child.nodeType!==Node.TEXT_NODE){child.remove();}
  });
 }
 clean(doc.body);return doc.body.innerHTML;
}
function boldNumberedRichBlocks(markup){
 const doc=new DOMParser().parseFromString(markup,"text/html");
 doc.body.querySelectorAll("p,div,li").forEach(block=>{
  const first=[...block.childNodes].find(n=>n.nodeType===Node.TEXT_NODE && n.textContent.trim());
  if(!first)return;
  const text=first.textContent;
  const m=text.match(/^(\s*(?:\d{1,3}[.、．)]|[一二三四五六七八九十百]+[、.．)]))(\s*)/);
  if(!m)return;
  const rest=text.slice(m[0].length);
  const fragment=doc.createDocumentFragment();
  const strong=doc.createElement("strong");strong.textContent=m[1];
  fragment.appendChild(strong);
  if(m[2])fragment.appendChild(doc.createTextNode(m[2]));
  if(rest)fragment.appendChild(doc.createTextNode(rest));
  first.replaceWith(fragment);
 });
 return doc.body.innerHTML;
}
function richHtml(value){
 const raw=String(value||"");
 if(/<\/?(?:b|strong|br|ul|ol|li|p|div)\b/i.test(raw))return boldNumberedRichBlocks(cleanRich(raw));
 return raw.split(/\r?\n/).map(line=>{
  const m=line.match(/^(\s*(?:\d{1,3}[.、．)]|[一二三四五六七八九十百]+[、.．)]))(\s*)(.*)$/);
  return m ? `<strong>${safe(m[1])}</strong>${safe(m[2])}${safe(m[3])}` : safe(line);
 }).join("<br>");
}
function richEditorHtml(value){return richHtml(value);}
function detailPreview(type,index,value,fallback){
 const shown=value||(!dismissedExamples.has(`${type}-${index}-detail`)?fallback:"");
 const isExample=!value&&!dismissedExamples.has(`${type}-${index}-detail`);
 return `<div class="item-detail ${isExample?"example":""}">${richHtml(shown)}</div>`;
}
function detailEditor(type,index,item){
 const placeholder=({education:"例如：主修课程、奖学金、校园活动或荣誉等",work:"例如：负责的工作内容、完成的任务、取得的数据成果等",intern:"例如：协助完成的工作、使用的工具、学习到的技能等",project:"例如：项目目标、本人负责的任务、实施过程和最终成果等"})[type];
 return `<div class="field full rich-field"><label>详细描述</label><div class="rich-toolbar"><button type="button" data-rich-command="bold">B 加粗</button><button type="button" data-rich-command="insertOrderedList">1. 编号分点</button><button type="button" data-rich-command="insertUnorderedList">• 圆点分点</button></div><div class="rich-editor" contenteditable="true" data-rich="1" data-i="${index}" data-t="${type}" data-k="detail" data-placeholder="${placeholder}">${richEditorHtml(item.detail)}</div></div>`;
}
function save(){try{localStorage.setItem("resumeData",JSON.stringify(data));localStorage.setItem("resumeHiddenSections",JSON.stringify([...hiddenSections]));}catch(e){}}
function restore(){try{const old=JSON.parse(localStorage.getItem("resumeData"));if(old)Object.assign(data,old);const hidden=JSON.parse(localStorage.getItem("resumeHiddenSections")||"[]");if(Array.isArray(hidden))hidden.forEach(type=>{if(Object.prototype.hasOwnProperty.call(types,type))hiddenSections.add(type);});}catch(e){}}
function createEditor(type){
 const root=document.getElementById("editors"),box=document.createElement("div");
 box.className="group";
 box.innerHTML=`<h3>${types[type]}</h3><div id="${type}-list"></div><button class="add" type="button">＋ 添加${types[type]}</button>`;
 root.appendChild(box);
 box.querySelector("button").onclick=()=>{hiddenSections.delete(type);data[type].push(type==="education"?{org:"",date:"",major:"",degree:"",detail:""}:{org:"",date:"",role:"",detail:""});render();save();};
}
function render(){
 Object.keys(types).forEach(type=>{
  const list=document.getElementById(type+"-list");list.innerHTML="";
  data[type].forEach((item,index)=>{
   const div=document.createElement("div");div.className="entry";
   div.innerHTML=`<div class="entry-title"><strong>${types[type]} ${index+1}</strong><button type="button">删除</button></div>
   <div class="fields">
   <div class="field"><label>${({education:"学校",work:"工作单位",intern:"实习单位",project:"项目名称"})[type]}</label><input data-i="${index}" data-t="${type}" data-k="org" placeholder="${({education:"例如：XX大学",work:"例如：某某科技有限公司",intern:"例如：某某咨询公司",project:"例如：校园市场调研项目"})[type]}" value="${safe(item.org)}"></div>
   <div class="field"><label>时间</label><input data-i="${index}" data-t="${type}" data-k="date" placeholder="例如：2022.09—2026.06" value="${safe(item.date)}"></div>
   ${type==="education"
     ? `<div class="field"><label>专业</label><input data-i="${index}" data-t="${type}" data-k="major" placeholder="例如：计算机科学与技术" value="${safe(item.major)}"></div>
        <div class="field"><label>学历</label><input data-i="${index}" data-t="${type}" data-k="degree" placeholder="例如：本科 / 硕士" value="${safe(item.degree)}"></div>`
     : `<div class="field full"><label>${({work:"工作职位",intern:"实习职位",project:"项目角色"})[type]}</label><input data-i="${index}" data-t="${type}" data-k="role" placeholder="${({work:"例如：产品运营专员",intern:"例如：市场实习生",project:"例如：项目负责人"})[type]}" value="${safe(item.role)}"></div>`}
   ${detailEditor(type,index,item)}
   </div>`;
   div.querySelector("button").onclick=()=>{data[type].splice(index,1);if(data[type].length===0)hiddenSections.add(type);render();update();save();};
   list.appendChild(div);
  });
 });
 update();
}
const examples={
 education:{org:"示例大学",date:"2020.09—2024.06",major:"工商管理",degree:"本科",detail:"主修课程：管理学、市场营销、数据分析等\n在校经历：获得校级奖学金，参与学生组织活动。"},
 work:{org:"示例科技有限公司",date:"2024.07—至今",role:"运营专员",detail:"1. 负责日常运营工作及项目推进，协调跨部门资源。\n2. 跟踪业务数据，定期整理分析并提出优化建议。"},
 intern:{org:"某某咨询公司",date:"2023.06—2023.09",role:"实习助理",detail:"协助团队完成资料收集、数据整理及报告撰写。"},
 project:{org:"校园市场调研项目",date:"2023.03—2023.05",role:"项目组成员",detail:"参与调研方案设计、问卷回收与结果分析，完成项目总结。"}
};
function previewField(type,index,key,value,fallback){
 const id=`${type}-${index}-${key}`;
 const shown=value||(!dismissedExamples.has(id)?fallback:"");
 const isExample=!value&&!dismissedExamples.has(id);
 return `<span class="${isExample?"example":""}" data-preview-key="${id}">${safe(shown).replace(/\n/g,"<br>")}</span>`;
}
function sectionHeading(type, isSample=false){
 const icons={target:"◎",education:"◆",work:"▣",intern:"▣",project:"◇",skills:"⚙",honors:"♙",summary:"●"};
 const icon=icons[type]||"◆";
 const label=`<span class="heading-label"><span class="heading-icon">${icon}</span><span>${types[type]||type}</span>${isSample?'<span class="example-tag">示例</span>':''}</span>`;
 return `<h2>${label}</h2>`;
}
function sampleSection(type){
 const x=examples[type];
 return `<div class="section">${sectionHeading(type,true)}<div class="resume-item">${type==="education"
 ? `<div class="item-head"><span>${previewField(type,0,"org","",x.org)}</span><span>${previewField(type,0,"date","",x.date)}</span></div><div class="item-sub">${previewField(type,0,"major","","工商管理")}　${previewField(type,0,"degree","","本科")}</div>`
 : `<div class="item-head experience-head"><span class="experience-org">${previewField(type,0,"org","",x.org)}</span><span class="experience-role">${previewField(type,0,"role","",x.role)}</span><span class="experience-date">${previewField(type,0,"date","",x.date)}</span></div>`}${detailPreview(type,0,"",x.detail)}</div></div>`;
}
function section(type){
 if(!data[type].length)return hiddenSections.has(type)?"":sampleSection(type);
 const sample=examples[type];
 return `<div class="section">${sectionHeading(type)}${data[type].map((x,index)=>`
 <div class="resume-item">${type==="education"
 ? `<div class="item-head"><span>${previewField(type,index,"org",x.org,index===0?sample.org:"")}</span><span>${previewField(type,index,"date",x.date,index===0?sample.date:"")}</span></div><div class="item-sub">${previewField(type,index,"major",x.major,index===0?sample.major:"")}　${previewField(type,index,"degree",x.degree,index===0?sample.degree:"")}</div>`
 : `<div class="item-head experience-head"><span class="experience-org">${previewField(type,index,"org",x.org,index===0?sample.org:"")}</span><span class="experience-role">${previewField(type,index,"role",x.role,index===0?sample.role:"")}</span><span class="experience-date">${previewField(type,index,"date",x.date,index===0?sample.date:"")}</span></div>`}${detailPreview(type,index,x.detail,index===0?sample.detail:"")}</div>`).join("")}</div>`;
}
function setExampleText(el,value,isExample){el.textContent=value;el.classList.toggle("example",isExample);}
function personalField(key,value){
 const el=document.getElementById(key==="name"?"v-name":"v-"+key+"-field");
 const fallback=personalExamples[key];
 const showExample=!value&&!dismissedExamples.has("personal-"+key);
 setExampleText(el,value||(showExample?fallback:""),showExample);
}
function update(){
 personalField("name",data.name);
 personalField("phone",data.phone?"电话："+data.phone:"");
 personalField("email",data.email?"邮箱："+data.email:"");
 personalField("political",data.political?"政治面貌："+data.political:"");
 personalField("birthday",data.birthday?"出生年月："+data.birthday:"");
 personalField("hometown",data.hometown?"籍贯："+data.hometown:"");
 personalField("target",data.target?"求职意向："+data.target:"");
 personalField("profile",data.profile?"个人补充信息："+data.profile:"");
 Object.keys(types).forEach(type=>{document.getElementById("v-"+type).innerHTML=section(type);});
 document.getElementById("v-skills").innerHTML=`<strong class="auto-field-label">专业技能：</strong>${richHtml(data.skills||"办公软件：熟练使用 Word、Excel、PowerPoint\\n专业能力：数据整理、沟通协调、文案撰写")}`;document.getElementById("v-skills").classList.toggle("example",!data.skills);
 document.getElementById("v-summary").innerHTML=`<strong class="auto-field-label">自我评价：</strong>${richHtml(data.summary||"做事认真负责，具备良好的沟通能力与团队协作意识；学习能力强，能够快速适应新环境，积极主动完成工作任务。")}`;document.getElementById("v-summary").classList.toggle("example",!data.summary);
 const photo=document.getElementById("v-photo"),placeholder=document.getElementById("v-photo-placeholder");
 photo.src=data.photo||"";photo.style.display=data.photo?"block":"none";placeholder.style.display=data.photo?"none":"flex";
}
document.addEventListener("focusin",e=>{
 const el=e.target;
 if(el.dataset.key && personalExamples[el.dataset.key]){
  const key="personal-"+el.dataset.key;
  if(!dismissedExamples.has(key)){dismissedExamples.add(key);update();}
 }
 if(el.dataset.t){
  const key=`${el.dataset.t}-${el.dataset.i}-${el.dataset.k}`;
  if(!dismissedExamples.has(key)){dismissedExamples.add(key);update();}
 }
});

document.addEventListener("input",e=>{
 const el=e.target;
 if(el.dataset.key){data[el.dataset.key]=el.isContentEditable?cleanRich(el.innerHTML):el.value;update();save();}
 if(el.dataset.t){data[el.dataset.t][Number(el.dataset.i)][el.dataset.k]=el.dataset.rich?cleanRich(el.innerHTML):el.value;update();save();}
});
document.addEventListener("mousedown",e=>{if(e.target.closest("[data-rich-command]"))e.preventDefault();});
document.addEventListener("click",e=>{
 const button=e.target.closest("[data-rich-command]");if(!button)return;
 const field=button.closest(".rich-field");const editor=field&&field.querySelector(".rich-editor");if(!editor)return;
 editor.focus();document.execCommand(button.dataset.richCommand,false,null);
 editor.dispatchEvent(new Event("input",{bubbles:true}));
});
document.getElementById("photoInput").addEventListener("change",e=>{
 const file=e.target.files[0];if(!file)return;
 if(!["image/jpeg","image/png","image/webp"].includes(file.type)){alert("请上传 JPG、PNG 或 WEBP 图片");return;}
 const reader=new FileReader();
 reader.onload=()=>{const img=new Image();img.onload=()=>{
  const canvas=document.createElement("canvas"),scale=Math.min(1,600/img.width,800/img.height);
  canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
  canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
  data.photo=canvas.toDataURL("image/jpeg",0.85);update();save();
 };img.src=reader.result;};
 reader.readAsDataURL(file);
});

function fitOnePage(){
 const preview=document.querySelector('.preview');
 if(!preview)return;
 const status=document.getElementById('fit-status');
 const baseFont=12;
 const measure=preview.cloneNode(true);
 measure.removeAttribute('id');
 measure.removeAttribute('data-fit-overflow');
 measure.removeAttribute('data-one-page-fit');
 measure.classList.add('fit-measure');
 const style=document.createElement('style');
 style.textContent=`
  .fit-measure{position:fixed!important;left:-30000px!important;top:0!important;display:block!important;
   box-sizing:border-box!important;width:210mm!important;max-width:none!important;height:auto!important;
   min-height:0!important;max-height:none!important;margin:0!important;padding:14mm 17mm!important;
   border:0!important;box-shadow:none!important;overflow:visible!important;}
  .fit-measure > *{flex:none!important;}
  .fit-measure .resume-header{grid-template-columns:minmax(0,1fr) 20mm;column-gap:4mm;
   min-height:calc(var(--fit-font)*6.5);margin-bottom:calc(var(--fit-font)*.3);align-items:center}
  .fit-measure .photo,.fit-measure .photo-placeholder{width:20mm;height:26.4mm;align-self:center}
  .fit-measure .personal-info{font-size:calc(var(--fit-font)*.92);line-height:var(--fit-line);gap:calc(var(--fit-font)*.25)}
  .fit-measure .resume-name{font-size:calc(var(--fit-font)*2.15);line-height:1.3}
  .fit-measure .section{margin-top:calc(var(--fit-font)*.35)}
  .fit-measure .resume-header + div .section{margin-top:calc(var(--fit-font)*.18)}
  .fit-measure .section h2{font-size:calc(var(--fit-font)*1.2);padding-bottom:calc(var(--fit-font)*.22);margin-bottom:calc(var(--fit-font)*.35)}
  .fit-measure .resume-item{margin-bottom:calc(var(--fit-font)*.42)}
  .fit-measure .item-sub,.fit-measure .item-detail{font-size:calc(var(--fit-font)*.92);line-height:var(--fit-line)}
  .fit-measure .item-detail{margin-top:calc(2px)}
  .fit-measure .info-row{column-gap:4mm}
  .fit-measure .example,.fit-measure .example-tag,.fit-measure .photo-placeholder{display:none!important}
 `;
 document.head.appendChild(style);
 document.body.appendChild(measure);
 const pageHeight=297*(96/25.4);
 let best=null;
 // 固定紧凑的板块间距，优先选择能填满页面的最大可读字号。
 for(let fontScale=2.40;fontScale>=0.60;fontScale-=0.02){
  const font=baseFont*fontScale;
  const line=Math.max(1.12,Math.min(1.85,1.45*(0.82+fontScale*0.18)));
  measure.style.setProperty('--fit-font',font.toFixed(2)+'px');
  measure.style.setProperty('--fit-line',line.toFixed(3));
  measure.style.setProperty('--fit-space','1');
  const h=measure.getBoundingClientRect().height;
  if(h<=pageHeight){
   best={font,line,space:1,fontScale,height:h};
   break;
  }
 }
 measure.remove();style.remove();
 preview.style.minHeight='0';
 if(best){
  preview.style.setProperty('--fit-font',best.font.toFixed(2)+'px');
  preview.style.setProperty('--fit-line',best.line.toFixed(3));
  preview.style.setProperty('--fit-space','1');
  preview.style.setProperty('--photo-width','20mm');
  preview.style.setProperty('--photo-height','26.4mm');
  preview.dataset.onePageFit='true';
  delete preview.dataset.fitOverflow;
  const fill=Math.min(100,Math.round(best.height/pageHeight*100));
  if(status)status.textContent=`单页排版完成：已收紧板块间距并调整字号，页面利用率约 ${fill}%`;
 }else{
  preview.style.setProperty('--fit-font','7.2px');
  preview.style.setProperty('--fit-line','1.08');
  preview.style.setProperty('--fit-space','1');
  preview.style.setProperty('--photo-width','15mm');
  preview.style.setProperty('--photo-height','19.8mm');
  preview.dataset.fitOverflow='true';
  delete preview.dataset.onePageFit;
  if(status)status.textContent='内容超过单页容量：已保留完整内容并自动分页';
 }
}

window.addEventListener("beforeprint",fitOnePage);


function applyTemplate(theme){
 const preview=document.querySelector('.preview');
 preview.classList.remove('theme-black','theme-navy');
 if(theme==='black')preview.classList.add('theme-black');
 if(theme==='navy')preview.classList.add('theme-navy');
 try{localStorage.setItem('resumeTemplate',theme);}catch(e){}
}
const templateSelect=document.getElementById('templateSelect');
templateSelect.addEventListener('change',()=>applyTemplate(templateSelect.value));
try{templateSelect.value=localStorage.getItem('resumeTemplate')||'original';}catch(e){}
applyTemplate(templateSelect.value);

function resetAll(){if(!confirm("确定清空已填写内容并恢复示例预览吗？"))return;localStorage.removeItem("resumeData");localStorage.removeItem("resumeHiddenSections");location.reload();}
Object.keys(types).forEach(createEditor);
restore();
// 兼容旧版教育经历：将原“职位 / 专业”内容拆分为专业和学历。
data.education=(data.education||[]).map(item=>{
 if(item && item.role && !item.major && !item.degree){
  const parts=String(item.role).split(/[｜|]/);
  item.major=(parts[0]||"").trim();
  item.degree=(parts.length>1?parts.slice(1).join("｜").trim():"");
 }
 if(item && item.major===undefined)item.major="";
 if(item && item.degree===undefined)item.degree="";
 if(item && Object.prototype.hasOwnProperty.call(item,"role"))delete item.role;
 return item;
});
// 兼容旧版本保存的数据：尽量拆分原有电话/邮箱及生日/籍贯内容，无法识别的内容保留。
if(data.contact && !data.phone && !data.email){
 const emailMatch=data.contact.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
 const phoneMatch=data.contact.match(/(?:\+?\d[\d\s()-]{6,}\d)/);
 if(emailMatch)data.email=emailMatch[0];
 if(phoneMatch)data.phone=phoneMatch[0].trim();
 if(!emailMatch && !phoneMatch)data.phone=data.contact;
 delete data.contact;
}
if(data.profile && !data.political){
 const p=data.profile.match(/政治面貌[:：]?\s*([^，,；;]+)/);
 if(p){data.political=p[1].trim();data.profile=data.profile.replace(/政治面貌[:：]?\s*[^，,；;]+[，,；;]?/,"").trim();}
}
if(data.profile && !data.birthday && !data.hometown){
 const b=data.profile.match(/生日[:：]?\s*([^，,；;]+)/);
 const h=data.profile.match(/籍贯[:：]?\s*([^，,；;]+)/);
 if(b)data.birthday=b[1].trim();
 if(h)data.hometown=h[1].trim();
 if(b||h)data.profile=data.profile.replace(/生日[:：]?\s*[^，,；;]+[，,；;]?/,'').replace(/籍贯[:：]?\s*[^，,；;]+[，,；;]?/,'').trim();
}
document.querySelectorAll("[data-key]").forEach(el=>{if(el.isContentEditable)el.innerHTML=richEditorHtml(data[el.dataset.key]||"");else el.value=data[el.dataset.key]||"";});
render();
</script>
</body>
